# Frøya–Smøla–Hitra on real bathymetry: a real coastline from a raster.
#
# The domain is a longitude/latitude box meshed as a 120 × 90 rectangle, its
# bed from Kartverket's 50 m topobathy model. The elements with no node
# below mean sea level are dropped, their faces becoming the coastline's
# walls, and the box's sides are open where they cross water. The bed is
# fetched once (about 4.6 MB, free, no account needed):
#
#   ./scripts/kartverket_topobathy.sh 8.0 63.6 9.2 64.0 50 data/froya_topobathy.tif
#   dgcom run cases/froya/case.toml
#
# The open boundary carries a uniform M2: the same phase all along it, as
# `examples/froya_real_data.rs tides=none` does. The real tide varies along
# the boundary and needs a tidal atlas, which case files cannot read yet
# (TODO P8.1). This case reproduces that example bit for bit
# (`notes/case-files.md`).

[run]
name = "froya"
start = "2025-06-15T00:00:00Z"
duration_hours = 12.42          # one M2 period

[mesh]
order = 2

[mesh.geographic]
bbox = [8.0, 63.6, 9.2, 64.0]   # west, south, east, north
nx = 120
ny = 90

[bathymetry.raster]
file = "../../data/froya_topobathy.tif"
kind = "topobathy"              # land heights and depths in one grid
fill_zero_holes = true          # the model marks missing depths with 0
land_elevation_m = 5.0          # land is capped here: it never floods

[physics]
coriolis = { f_plane = 1.31e-4 }
friction = { manning = 0.025 }

[[boundary]]
tag = "open"
velocity = "at_rest"
[boundary.tide]
ramp_hours = 1.0
constituents = [{ name = "M2", amplitude_m = 0.8 }]

[output]
interval_minutes = 10.0

[[output.station]]
name = "Mausund"                # Kartverket's tide gauge (MSU)
lat = 63.869331
lon = 8.665231
