# Frøya–Smøla–Hitra: tides on real bathymetry.
#
# The domain is a longitude/latitude box meshed as a 120 × 90 rectangle,
# with its bed from Kartverket's 50 m topobathy model. The elements with no
# node below mean sea level are dropped, their faces becoming the
# coastline's walls, and the box's sides are open where they cross water.
#
# The open boundary carries NorKyst-800's tide: twelve constituents of level
# and depth-mean current varying along the boundary, from a tidal atlas
# fitted to a month of NorKyst. The inputs, fetched once (free, no account
# needed):
#
#   ./scripts/kartverket_topobathy.sh 8.0 63.6 9.2 64.0 50 data/froya_topobathy.tif
#   cargo run --release --example norkyst_boundary_tides -- \
#       bbox=8.0,63.6,9.2,64.0 out=data/froya_boundary_tides.txt
#   dgcom run cases/froya/case.toml
#
# This case reproduces `examples/froya_real_data.rs gauge_gains= gauge_ratios=`
# bit for bit (`notes/case-files.md`). The example's default also corrects
# the atlas with the Mausund gauge, which case files cannot do yet (TODO
# P8.1). `correction = "theory"` corrects it without a gauge.

[run]
name = "froya"
start = "2025-06-15T00:00:00Z"
duration_hours = 12.42          # one M2 period

[mesh]
order = 2

[mesh.geographic]
bbox = [8.0, 63.6, 9.2, 64.0]   # west, south, east, north
nx = 120
ny = 90

[bathymetry.raster]
file = "../../data/froya_topobathy.tif"
kind = "topobathy"              # land heights and depths in one grid
fill_zero_holes = true          # the model marks missing depths with 0
land_elevation_m = 5.0          # land is capped here: it never floods

[physics]
coriolis = { f_plane = 1.31e-4 }
friction = { manning = 0.025 }

[[boundary]]
tag = "open"
[boundary.atlas]
file = "../../data/froya_boundary_tides.txt"
ramp_hours = 1.0

[output]
interval_minutes = 10.0

[[output.station]]
name = "Mausund"                # Kartverket's tide gauge (MSU)
lat = 63.869331
lon = 8.665231
