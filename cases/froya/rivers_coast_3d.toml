# `rivers_3d.toml` on a coastline mesh refined at the river mouths.
#
# The 500 m grid of `rivers_3d.toml` has a node on land in nearly every
# coastal element, and a river enters an element under water at every node
# (`source::river`), so its rivers move up to 1.2 km off their mouths. Here
# the coastline mesh (`scripts/gmsh_coastline_mesh.py`, 200 m at the coast,
# as `data/froya_coast.msh`) is refined to 50 m within 1 km of the nine
# mouths inside the box, keeping their estuaries open, so that each river
# enters within an element of its mouth (`notes/inputs-forcing.md`, rivers).
# The four mouths south of the box are left out: the parent's water brings
# them in. The inputs, besides `rivers_3d.toml`'s:
#
#   uv run scripts/gmsh_coastline_mesh.py dem=data/froya_topobathy.tif #       bbox=8.0,63.6,9.2,64.0 rivers=data/froya_rivers.nc #       out=data/froya_coast_rivers.msh
#   dgcom run cases/froya/rivers_coast_3d.toml

[run]
name = "froya_rivers_coast_3d"
start = "2025-06-15T00:00:00Z"
duration_hours = 12.42          # one M2 period

[mesh]
order = 2

gmsh = "../../data/froya_coast_rivers.msh"
origin = { lat = 63.8, lon = 8.6 }   # the box's centre

[bathymetry.raster]
file = "../../data/froya_topobathy.tif"
kind = "topobathy"
fill_zero_holes = true
land_elevation_m = 5.0

# The bed σ-levels need: within an element r_x0 ≤ 0.15 below the summer
# pycnocline, cliff shores raised to land, tidal ponds filled. Without it
# the refined mesh resolves cliffs (a 1.2 m node beside 75–80 m ones,
# r_x0 ≈ 0.97) whose σ-level currents reached 21 m/s within 400 s and blew
# the run up (TODO P1.6, 2026-11-09).
[bathymetry.slopes_3d]

[physics]
coriolis = { f_plane = 1.31e-4 }      # the bed friction is [three_d]'s drag

[[boundary]]
tag = "open"
[boundary.nesting]
file = "../../data/froya_norkyst_3d.nc"
atlas = "../../data/froya_boundary_tides.txt"   # NorKyst's own month-long fit
band_km = 3.0
band_minutes = 30.0
ramp_hours = 1.0
[boundary.nesting.gauge]
record = "../../data/tide_gauges/mausund_obs.txt"
source = "../../data/froya_station_tides.txt"

[three_d]
levels = 20

[rivers]
file = "../../data/froya_rivers.nc"   # NorKyst-800's NVE rivers, daily
snap_km = 2.0
profile = "tapered:3"

[output]
interval_minutes = 60.0
station_interval_minutes = 10.0

[[output.station]]
name = "Mausund"
lat = 63.869331
lon = 8.665231
gauge = "../../data/tide_gauges/mausund_obs.txt"   # scored after the ramp: gauge_skill.csv
