# Chiloé and the Chilean Inland Sea: tides on GEBCO bathymetry.
#
# The first case outside Norway (#220, this case #213;
# `notes/case-files.md` P8.6). The domain is a longitude/latitude box
# around the whole inner sea, because its tide is a basin-scale resonance:
# M2 grows from ≈ 2 m range at Boca del Guafo to ≈ 6 m in the Gulf of Ancud
# and over 7 m at Puerto Montt, and a boundary cut inside the inner sea
# would prescribe the resonance instead of computing it. The box's sides are
# open where they cross water. The west side lies at 75.9°W, in more than 1500 m
# of water west of Isla Guafo, Isla Guamblin and Taitao (at 74.6°W it ran
# past Guafo through TPXO10 M2 currents of 0.3-0.65 m/s).
# The box reaches south to the Taitao peninsula (46.6°S), which closes the
# Moraleda and Aysén channels on land: every open face is then in the ocean
# (the southern side is 25 km of deep water west of Taitao). A box cut at
# 44.2°S, across the Chonos passages and northern Moraleda, prescribed
# TPXO10's 1 m M2 inside the southern arm of the inner sea; that raised the
# whole inner sea (Puerto Montt's range 30 % too large instead of 10 %) and
# held Melinka, 30 km from the cut, near the atlas whatever the model did
# (`notes/case-files.md`, 2026-11-10).
#
# TPXO10-atlas (1/30°) carries the amplification itself (M2 0.46 m at Ancud,
# 0.85 m at Melinka, 1.85 m at Puerto Montt; no water within 10 km of
# Castro): it is the baseline this case has to beat at the gauges.
#
# The open boundary carries a global tide model's tide (TPXO10-atlas, or
# FES2022: level and depth-mean current per constituent along the
# boundary) from `scripts/tide_model_boundary_atlas.py`. The inputs, fetched
# once:
#
#   1. GEBCO's global grid over the box as a GeoTIFF (free, no account):
#      https://download.gebco.net, bbox -75.9,-46.6,-72.3,-41.3, saved as
#      data/chiloe_gebco.tif. Its land is elevation, its sea depth below
#      mean sea level, at 15″ (≈ 460 × 340 m here): Chacao's 2 km narrows
#      are four pixels wide, so its 3–4 m/s jet is not resolved.
#   2. TPXO10-atlas-v2 (netCDF, free for academic use after registering at
#      https://www.tpxo.net) under data/tide_models/TPXO10_atlas_v2/ (the zip
#      unpacks to TPXO10_atlas_v2_nc/: rename it), then
#        uv run scripts/tide_model_boundary_atlas.py bbox=-75.9,-46.6,-72.3,-41.3 \
#            model=TPXO10-atlas-v2-nc model_dir=data/tide_models \
#            points="-72.9608,-41.4850;-73.8329,-41.8674;-73.7581,-42.4808;-73.7483,-43.8983" \
#            points_out=data/chiloe_station_tides.txt out=data/chiloe_boundary_tides.txt
#   3. dgcom run cases/chiloe/case.toml
#
# Scored against SHOA's gauges (Puerto Montt, Ancud, Castro, Melinka, on the
# IOC Sea Level Station Monitoring Facility as pmon, ancu, cstr, pmel):
#
#   uv run scripts/ioc_gauge_skill.py stations=cases/chiloe/output/chiloe/stations.csv #       start=2025-11-12T00:00:00 gauges="Puerto Montt:pmon;Ancud:ancu;Castro:cstr;Melinka:pmel"
#
# At 1 km on GEBCO, over four days (2026-11-10, centred RMSE per M2 period):
# 3-6 cm at Ancud (TPXO10 itself: 18-26 cm), 10-14 cm at Melinka (1-4 cm),
# 29-36 cm at Puerto Montt (6-15 cm). The inner sea's tide is 25-35 min late
# from Boca del Guafo inward and 8-17 % too large at its head: a basin whose
# resonance is too low on this bed and mesh, not the friction. A coastline
# mesh and an independent bed are next (`notes/case-files.md`). Castro's
# fjord is not on the mesh at 1 km.
#
# Southern hemisphere: the Coriolis parameter is negative here (f ≈ −9.9e-5
# s⁻¹ at 42.5°S). `beta_plane` takes it from the box's own latitude, so do
# not copy a Norwegian `f_plane` value.

[run]
name = "chiloe"
start = "2025-11-12T00:00:00Z"
duration_hours = 24.84          # two M2 periods

[mesh]
order = 2

[mesh.geographic]
bbox = [-75.9, -46.6, -72.3, -41.3]   # west, south, east, north
nx = 288                        # ≈ 1 km elements (288 × 589 km)
ny = 589

[bathymetry.raster]
file = "../../data/chiloe_gebco.tif"
kind = "topobathy"              # GEBCO: land heights and depths in one grid
land_elevation_m = 10.0         # above the highest water (Puerto Montt's spring range > 7 m)

[physics]
coriolis = "beta_plane"         # f = f₀ + βy about the box's centre (42.75°S): f₀ < 0
friction = { manning = 0.025 }

[[boundary]]
tag = "open"
[boundary.atlas]
file = "../../data/chiloe_boundary_tides.txt"   # TPXO10-atlas along the box
ramp_hours = 3.0                # the inner sea's resonance needs a gentler start
correction = "minors"           # μ2, ν2, λ2, L2, T2 by admittance: 15 cm RMS at Puerto Montt

[output]
interval_minutes = 10.0

# SHOA's permanent tide gauges (GLOSS/IOC), positions from SHOA's GLOSS reports
[[output.station]]
name = "Puerto Montt"           # GLOSS 178, Reloncaví Sound
lat = -41.4850
lon = -72.9608

[[output.station]]
name = "Ancud"                  # Gulf of Coronados, Chacao's western mouth
lat = -41.8674
lon = -73.8329

# Castro (42.4808°S 73.7581°W, gauge cstr): no element within 3 km on GEBCO at
# 1 km; its fjord needs the coastline mesh.

[[output.station]]
name = "Melinka"                # Guaitecas, near Boca del Guafo
lat = -43.8983
lon = -73.7483
