# Bodø and Saltstraumen's approaches: tides on a coastline-fitted mesh.
#
# The mesh is a Gmsh mesh fitted to the coastline (made by
# `scripts/gmsh_coastline_mesh.py`), in metres in the local projection about
# the centre of the box 13.7–14.55°E, 67.05–67.5°N, which `mesh.origin`
# states. Its bed is Kartverket's 50 m topobathy model, and the open
# boundary carries NorKyst-800's tide from a tidal atlas. The inputs, made
# once (free, no account needed):
#
#   ./scripts/kartverket_topobathy.sh 13.7 67.05 14.55 67.5 50 data/bodo_topobathy.tif
#   uv run scripts/gmsh_coastline_mesh.py dem=data/bodo_topobathy.tif \
#       bbox=13.7,67.05,14.55,67.5 out=data/bodo_coast.msh
#   cargo run --release --example norkyst_boundary_tides -- \
#       bbox=13.7,67.05,14.55,67.5 out=data/bodo_boundary_tides.txt
#   dgcom run cases/bodo/case.toml
#
# Unlike `examples/froya_real_data.rs`, which applies Frøya's Coriolis
# parameter everywhere, this case takes the beta plane at Bodø's latitude
# (f = 1.345e-4 against Frøya's 1.31e-4).

[run]
name = "bodo"
start = "2025-06-15T00:00:00Z"
duration_hours = 24.0

[mesh]
order = 2
gmsh = "../../data/bodo_coast.msh"
origin = { lat = 67.275, lon = 14.125 }

[bathymetry.raster]
file = "../../data/bodo_topobathy.tif"
kind = "topobathy"
fill_zero_holes = true
land_elevation_m = 5.0

[physics]
coriolis = "beta_plane"
friction = { manning = 0.025 }

[[boundary]]
tag = "open"
[boundary.atlas]
file = "../../data/bodo_boundary_tides.txt"
ramp_hours = 3.0

[output]
interval_minutes = 10.0

[[output.station]]
name = "Bodø"                   # Kartverket's tide gauge (BOO)
lat = 67.288
lon = 14.391
