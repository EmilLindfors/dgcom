# Bodø, 2026-06-12, in 3D: the scored nested 3D run (`notes/validation.md`,
# "Raw-forcing re-score on 2026-06-12", the 3D outcome).
#
# `scored_2026-06-12.toml`'s domain and day in 3D (`[three_d]`): 20 σ-layers
# of velocity, temperature and salinity under the depth mean, started from
# NorKyst-800's own columns at 00 UTC and nested in them across the 3 km
# band, k-ε mixing and a log-layer bottom drag. As scored, NorKyst's tide is
# taken as it is (`nest_tides=raw`, the atlas for its datum only); add
# `correction = "theory"` with the `_nkratios` atlas for the corrected tide.
# At the Bodø gauge the scored run gave 12.0 cm centred RMSE against the
# observations over hours 3–24 (the 2D raw run 11.8 cm): the gauge measures
# NorKyst's tide on that day. The parent must hold its profiles
# (`profiles=1`, below) and reach past the run's end by a third of the
# longest 3D step. The inputs, besides `scored_2026-06-12.toml`'s:
#
#   cargo run --release --example norkyst_boundary_tides -- \
#       bbox=13.7,67.05,14.55,67.5 start=2026-06-01 days=30 spacing_km=1.0 \
#       out=data/bodo_boundary_tides_2026-06.txt
#   dgcom run cases/bodo/scored_3d_2026-06-12.toml
#
# This case is `output/p34_2026-06-12/run.sh bodo_3d` (`froya_real_data
# levels=20 tide3d=1`) bit for bit (`notes/case-files.md`). It took 8517 s
# for the day on 16 threads.

[run]
name = "bodo_3d_2026-06-12"
start = "2026-06-12T00:00:00Z"
duration_hours = 24.0

[mesh]
order = 2
gmsh = "../../data/bodo_coast.msh"
origin = { lat = 67.275, lon = 14.125 }

[bathymetry.raster]
file = "../../data/bodo_topobathy.tif"
kind = "topobathy"
fill_zero_holes = true
land_elevation_m = 5.0

# The 3D bed, [bathymetry.slopes_3d]'s defaults, is a 3D run's by default
# (thin_depth_m: [three_d]'s)

[physics]
coriolis = { f_plane = 1.31e-4 }      # the bed friction is [three_d]'s drag

[[boundary]]
tag = "open"
[boundary.nesting]
file = "../../data/bodo_norkyst_3d_2026-06-12.nc"
atlas = "../../data/bodo_boundary_tides_2026-06.txt"
ramp_hours = 3.0

[three_d]
levels = 20

[output]
interval_minutes = 60.0
station_interval_minutes = 10.0

[[output.station]]
name = "Bodø"
lat = 67.288
lon = 14.391
gauge = "../../data/tide_gauges/bodo_obs_202606.txt"
